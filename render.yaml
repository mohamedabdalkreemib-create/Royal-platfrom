services:
  # 1. سيرفر الباكيند المجاني (FastAPI)
  - type: web
    name: royal-backend-api
    env: python
    plan: free # هذا السطر صحيح وسيعمل للباكيند
    buildCommand: pip install -r requirements.txt && python main.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"

  # 2. سيرفر الواجهة الأمامية المجاني (React Static Site)
  - type: static # تم تعديل النوع هنا لمنع الخطأ وطلب الدفع
    name: royal-front-display
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
